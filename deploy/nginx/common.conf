# Wspólne ustawienia proxy do API (dołączane w obu trybach).

# Bez adresów IP w logach: dziennik dostępu wyłączony, dziennik błędów tylko
# poważne błędy (komunikaty "error" zawierają adres klienta).
access_log off;
error_log /dev/stderr crit;

client_max_body_size 64k;
server_tokens off;

location /api/ {
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_read_timeout 15s;
}

location / {
    return 404;
}
