<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obracanie kostki — Test IQ PL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="site"><div class="wrap">
  <a class="brand" href="../">Test IQ <span>PL</span></a>
  <span class="kicker">Wersja robocza</span>
</div></header>

<main class="wrap" id="app"></main>

<footer><div class="wrap">
  Zadania generowane są algorytmicznie. Normy nie są jeszcze dostępne — zbieramy dane.
</div></footer>

<script src="../assets/config.js"></script>
<script src="../assets/cube-core.js"></script>
<script src="../assets/cube-render.js"></script>
<script>
(function () {
  'use strict';
  const C = window.CubeCore, R = window.CubeRender;
  const TEST_ID = 'kostka-v1';
  const N_ITEMS = 20;
  const TIME_LIMIT = 8 * 60;
  const LETTERS = 'ABCDEF';
  const app = document.getElementById('app');

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  function participantId() {
    let id = store.get('testiq-pid');
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
      store.set('testiq-pid', id);
    }
    return id;
  }

  const h = (html) => { app.innerHTML = html; window.scrollTo(0, 0); };

  // Blok zadania: kostka startowa + ruchy + 6 opcji.
  function renderItem(container, item, onPick) {
    const stem = document.createElement('div');
    stem.className = 'stem';
    const fig0 = document.createElement('figure');
    fig0.appendChild(R.drawCube(item.start, item.faces, 'big'));
    stem.appendChild(fig0);
    item.moves.forEach((mi, i) => {
      const f = document.createElement('figure');
      f.appendChild(R.drawMove(C.MOVES[mi], 'small'));
      const cap = document.createElement('figcaption');
      cap.textContent = String(i + 1);
      f.appendChild(cap);
      stem.appendChild(f);
    });
    container.appendChild(stem);
    const grid = document.createElement('div');
    grid.className = 'options';
    item.options.forEach((Ro, i) => {
      const b = document.createElement('button');
      b.className = 'opt';
      b.type = 'button';
      b.setAttribute('aria-label', 'Odpowiedź ' + LETTERS[i]);
      const l = document.createElement('div');
      l.className = 'lbl';
      l.textContent = LETTERS[i];
      b.appendChild(l);
      b.appendChild(R.drawCube(Ro, item.faces));
      b.addEventListener('click', () => onPick(i, b, grid));
      grid.appendChild(b);
    });
    container.appendChild(grid);
  }

  // ---------- ekran 1: opis + przykład ----------
  function intro() {
    h(`
      <div class="kicker">Zdolności przestrzenne · 20 zadań · 8 minut</div>
      <h1>Obracanie kostki</h1>
      <p class="lead">Test wyobraźni przestrzennej: trzeba w myślach śledzić, jak zmienia się położenie kostki po kolejnych obrotach.</p>
      <p>Kostka jest obracana o ćwierć obrotu, krok po kroku, tak jak pokazują strzałki. Ścianka ze strzałką przetacza się w kierunku, w który strzałka wskazuje. Wybierz obrazek, który pokazuje kostkę po wszystkich obrotach.</p>
      <p>Ścianki, których na początku nie widać, są puste. Na obrazkach z odpowiedziami też będą puste.</p>
      <h2>Przykład</h2>
      <div id="example"></div>
      <p class="note" id="exnote">Kliknij odpowiedź, żeby zobaczyć, czy jest poprawna.</p>
      <h2>Zanim zaczniesz</h2>
      <p class="note">Te dane pomogą zbudować polskie normy. Są dobrowolne.</p>
      <label class="field">Rok urodzenia
        <input type="number" id="by" min="1920" max="2020" placeholder="np. 1999">
      </label>
      <label class="field">Wykształcenie
        <select id="edu">
          <option value="">— wolę nie podawać —</option>
          <option value="podstawowe">podstawowe / gimnazjalne</option>
          <option value="zawodowe">zasadnicze zawodowe</option>
          <option value="srednie">średnie</option>
          <option value="wyzsze-w-trakcie">studia w trakcie</option>
          <option value="wyzsze">wyższe</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="consent">
        <span>Zgadzam się na anonimowe wykorzystanie moich odpowiedzi do opracowania norm testu.</span></label>
      <p><button class="btn" id="start">Rozpocznij test</button></p>
    `);
    const ex = C.generateItems('kostka-przyklad', 4)[0];
    let done = false;
    renderItem(document.getElementById('example'), ex, (i, b, grid) => {
      if (done) return;
      done = true;
      b.classList.add('picked');
      grid.children[ex.answer].classList.add('right');
      document.getElementById('exnote').textContent = i === ex.answer
        ? 'Dobrze. Na prawdziwym teście nie zobaczysz, czy odpowiedź jest poprawna.'
        : 'Poprawna odpowiedź to ' + LETTERS[ex.answer] + '. Na prawdziwym teście nie zobaczysz, czy odpowiedź jest poprawna.';
    });
    document.getElementById('start').addEventListener('click', () => {
      run({
        birthYear: Number(document.getElementById('by').value) || null,
        education: document.getElementById('edu').value || null,
        consent: document.getElementById('consent').checked,
      });
    });
  }

  // ---------- ekran 2: test ----------
  function run(meta) {
    const items = C.generateItems(TEST_ID, N_ITEMS);
    const responses = [];
    const t0 = Date.now();
    let idx = 0, tShown = 0, finished = false;

    h(`
      <div class="testbar"><span class="kicker" id="count"></span><span class="timer" id="timer"></span></div>
      <div class="progress"><div id="bar"></div></div>
      <p class="question">Która kostka pokazuje położenie po wszystkich obrotach?</p>
      <div id="item"></div>
    `);
    const timerEl = document.getElementById('timer');
    const tick = () => {
      const left = Math.max(0, TIME_LIMIT - Math.floor((Date.now() - t0) / 1000));
      timerEl.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
      if (left === 0) finish(true);
    };
    const timer = setInterval(tick, 250);
    tick();

    function show() {
      document.getElementById('count').textContent = 'Zadanie ' + (idx + 1) + ' z ' + N_ITEMS;
      document.getElementById('bar').style.width = (idx / N_ITEMS * 100) + '%';
      const box = document.getElementById('item');
      box.innerHTML = '';
      tShown = Date.now();
      renderItem(box, items[idx], (i, b) => {
        b.classList.add('picked');
        responses.push({
          item: idx + 1, moves: items[idx].moves.length, choice: i,
          correct: i === items[idx].answer, ms: Date.now() - tShown,
        });
        idx++;
        setTimeout(() => (idx < N_ITEMS ? show() : finish(false)), 180);
      });
    }

    function finish(timedOut) {
      if (finished) return;
      finished = true;
      clearInterval(timer);
      const result = {
        test: TEST_ID, version: 1, participant: participantId(),
        startedAt: new Date(t0).toISOString(), durationMs: Date.now() - t0, timedOut,
        meta, responses,
      };
      store.set('testiq-last-' + TEST_ID, JSON.stringify(result));
      send(result);
      results(result);
    }
    show();
  }

  function send(result) {
    const url = window.TESTIQ_CONFIG && window.TESTIQ_CONFIG.apiUrl;
    if (!url || !result.meta.consent) return;
    fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(result) })
      .catch(() => {});
  }

  // ---------- ekran 3: wynik ----------
  function results(r) {
    const score = r.responses.filter((x) => x.correct).length;
    const rows = [1, 2, 3, 4].map((m) => {
      const sub = r.responses.filter((x) => x.moves === m);
      const ok = sub.filter((x) => x.correct).length;
      const ms = sub.length ? Math.round(sub.reduce((a, x) => a + x.ms, 0) / sub.length / 100) / 10 : null;
      return `<tr><td>${m} ${m === 1 ? 'obrót' : 'obroty'}</td><td>${ok} / 5</td><td>${ms === null ? '—' : ms + ' s'}</td></tr>`;
    }).join('');
    const fast = r.responses.filter((x) => x.ms < 2000).length;
    h(`
      <div class="kicker">Wynik</div>
      <h1>Obracanie kostki</h1>
      <div class="card">
        <div class="score">${score} <span class="note">/ ${N_ITEMS}</span></div>
        <p class="note">Losowe zgadywanie daje średnio ok. 3 punkty.${r.timedOut ? ' Skończył się czas.' : ''}</p>
        ${fast >= 5 ? `<p class="note">${fast} odpowiedzi padło w mniej niż 2 sekundy. Taki wynik może nie odzwierciedlać twoich możliwości.</p>` : ''}
      </div>
      <table class="res">
        <tr><th>Poziom</th><th>Poprawne</th><th>Średni czas</th></tr>
        ${rows}
      </table>
      <h2>Co ten wynik znaczy</h2>
      <p>Na razie test nie ma polskich norm, więc nie przeliczamy wyniku na skalę IQ. Gdy zbierzemy wystarczająco dużo odpowiedzi, wynik zostanie porównany z innymi uczestnikami w twoim wieku.</p>
      <p><button class="btn ghost" id="dl">Pobierz dane (JSON)</button> <a class="btn ghost" href="../">Wróć</a></p>
    `);
    document.getElementById('dl').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(r, null, 2)], { type: 'application/json' }));
      a.download = TEST_ID + '-' + r.startedAt.slice(0, 10) + '.json';
      a.click();
    });
  }

  intro();
})();
</script>
</body>
</html>
